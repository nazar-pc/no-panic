[package]
name = "no-panic-const"
version = "0.1.36-const-0"
authors = ["David Tolnay <dtolnay@gmail.com>", "Nazar Mokrynskyi <nazar@mokrynskyi.com>"]
categories = ["no-std", "no-std::no-alloc"]
description = "Fork of no-panic crate with const fn and const Trait support"
documentation = "https://docs.rs/no-panic-const"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nazar-pc/no-panic"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.74"
quote = "1.0.35"
syn = { version = "2.0.46", features = ["full"] }

[dev-dependencies]
rustversion = "1.0.13"
scratch = "1"
trybuild = { version = "1.0.108", features = ["diff"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = [
    "--generate-link-to-definition",
    "--generate-macro-expansion",
    "--extern-html-root-url=core=https://doc.rust-lang.org",
    "--extern-html-root-url=alloc=https://doc.rust-lang.org",
    "--extern-html-root-url=std=https://doc.rust-lang.org",
    "--extern-html-root-url=proc_macro=https://doc.rust-lang.org",
]

[workspace]
members = ["noexcept", "noexcept-impl"]
